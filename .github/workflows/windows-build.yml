name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable Windows EXE
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name CyberShieldToolkit
          CyberShield_Complete_Portable/src/cybershield_toolkit.py

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberShieldToolkit-Windows
          path: dist/CyberShieldToolkit.exe
          if-no-files-found: error
          retention-days: 30

      # The v1.0.0 tag/release was created before this workflow existed.
      # On the first main-branch build, attach the resulting EXE to that release.
      - name: Attach EXE to v1.0.0 release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: dist/CyberShieldToolkit.exe
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Future version tags automatically get their own release and EXE asset.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberShieldToolkit.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
